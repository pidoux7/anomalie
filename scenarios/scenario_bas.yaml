# ============================================================
# Scenario "bas" — démarrage en douceur, montée graduelle
# Lancement : python3 scripts/montage_grille.py scenarios/scenario_bas.yaml
#
# Hérite automatiquement de configs/config.yaml ; on n'écrit ici que
# les clés à overrider.
# ============================================================

# Sortie distincte pour ne pas écraser le rendu de la config principale
output_video: "videos/scenario_bas.mp4"

# Plan explicite
mode_plan: "scenario"

scenario:
  duree_par_defaut: "boucle"
  sequences:
    - { taille: 1 }                                              # ouverture plein cadre
    - { taille: 2, anomalies: 1, filtre: "flou_gauss_fort" }     # 1 cellule floue
    - { taille: 4, anomalies: 2, filtre: "pixelise_fort" }       # 2 cellules pixelisées
    - { taille: 8, anomalies: 4, aleatoire: true }               # 4 anomalies tirées au hasard
    - { taille: 16, anomalies: 6, filtre: 2 }                    # 6 cellules, filtre par index (1-based)
    - { taille: 16, effet: "lsd", duree: 20 }                    # final psychédélique 20s

# Audio en mode timeline : fond ambiant mixé + piste qui écrase la dernière minute
audio:
  mode: "scenario"
  conflit_par_defaut: "ecrase"
  scenario:
    - { ancre: "fond", fichier: "musiques/spiral.mp3", volume: 0.3, mode: "mix" }
    - { ancre: "duree", de: "1:00", a: "2:00",
        fichier: "musiques/spiral.mp3", debut: "0:30", volume: 0.8 }
