# ============================================================
# Scenario "lsd_audio_winter" : test lsd_audio sur winter.mp3
# Audio joué à partir de 1:00 dans le fichier.
# IMPORTANT : audio.fichiers[*].debut ET lsd_audio.debut doivent être
# alignés pour que la modulation visuelle corresponde au son entendu.
#
# Lancement :
#     python3 scripts/montage_grille.py scenarios/lsd_audio_winter.yaml --preview
#     python3 scripts/montage_grille.py scenarios/lsd_audio_winter.yaml
# ============================================================

output_video: "videos/lsd_audio_winter.mp4"
input_anomalie: null
max_cases: 1024
masques: { actif: false }

effets:
  lsd:
    amplitude_onde: 70      # base relevée (60 → 100) → ondes plus amples au pic
    vitesse_onde: 0.35       # un peu plus rapide pour suivre les beats
    frequence_onde: 8
    aberration: 3
    saturation: 1.3
    teinte: 200              # bleu-violet
    bruit: 35                # un peu plus de grain
    lignes_force: 0.5        # contours plus marqués au pic
    lignes_mode: "edges"

  lsd_audio:
    fichier: "musiques/winter.mp3"
    debut: "1:00"            # ⇆ doit matcher audio.fichiers[0].debut !
    buckets: null            # défaut 4/s — capture bien les beats
    lissage: 1               # peu de lissage → suit bien les attaques
    puissance: 3.0           # contraste fort : valeurs moyennes écrasées
    percentile: 0.95         # 95e perc → seul le top 5% atteint 1.0
    # SEUIL : RMS sous ce seuil → effet invisible (repos_amplitude).
    # Au-dessus → rampe linéaire vers le max. Donne un vrai contraste
    # silence/explosion plutôt que mouvement permanent.
    seuil: 0.2            # ~50% des buckets devraient passer au-dessus
    # Le facteur multiplie l'amplitude des ondes dans geq :
    #   sous seuil : amp_eff = amp_base × repos_amplitude (vidéo nette)
    #   au-dessus  : amp_eff = amp_base × (repos + mod_amp × normalisé)
    repos_amplitude: 0.02    # 2% au repos = vidéo presque intacte
    mod_amplitude: 3.0       # pic → facteur ≈ 3.02 → effet ample
    mod_saturation: 2.0      # pic → sat × 3 = très saturé
    mod_aberration: 4.0      # pic → aber × 5 = aberration forte

# Audio : winter.mp3 lu à partir de 1:00
audio:
  actif: true
  mode: "auto"
  comportement: "continu"
  fichiers:
    - { fichier: "musiques/winter.mp3", debut: "1:00" }
  audio_source: "couper"
  volume_musique: 0.85

mode_plan: "scenario"
scenario:
  duree_par_defaut: 10
  sequences:
    - { taille: 16, effet: "lsd_audio", duree: 15 }
    - { taille: 32, effet: "lsd_audio", duree: 15 }
