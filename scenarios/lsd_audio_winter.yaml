# ============================================================
# Scenario "lsd_audio_winter" : test lsd_audio sur winter.mp3
# Audio joué à partir de 1:00 dans le fichier.
# IMPORTANT : audio.fichiers[*].debut ET lsd_audio.debut doivent être
# alignés pour que la modulation visuelle corresponde au son entendu.
#
# Lancement :
#     python3 scripts/montage_grille.py scenarios/lsd_audio_winter.yaml --preview
#     python3 scripts/montage_grille.py scenarios/lsd_audio_winter.yaml
# ============================================================

output_video: "videos/lsd_audio_winter.mp4"
input_anomalie: null
max_cases: 1024
masques: { actif: false }

effets:
  lsd:
    amplitude_onde: 60       # base calme
    vitesse_onde: 0.25
    frequence_onde: 8
    aberration: 2
    saturation: 1.2
    teinte: 200              # bleu-violet
    bruit: 30
    lignes_force: 0.4
    lignes_mode: "edges"

  lsd_audio:
    fichier: "musiques/winter.mp3"
    debut: "1:00"            # ⇆ doit matcher audio.fichiers[0].debut !
    buckets: null            # défaut 4/s
    lissage: 4               # adoucit la modulation
    puissance: 2.5
    percentile: 0.85
    # Le facteur multiplie l'amplitude des ondes dans geq :
    #   amplitude_effective = amp_base × (repos + mod_amplitude × rms)
    # repos très bas → vidéo presque intacte sur les silences
    # repos + mod_amp(=pic) → déformation maxi
    repos_amplitude: 0.05    # 5% d'amplitude au repos = vidéo quasi nette
    mod_amplitude: 1.5       # pic → facteur ≈ 1.55 (amp×1.55 = ample)
    mod_saturation: 1.0
    mod_aberration: 2.0

# Audio : winter.mp3 lu à partir de 1:00
audio:
  actif: true
  mode: "auto"
  comportement: "continu"
  fichiers:
    - { fichier: "musiques/winter.mp3", debut: "1:00" }
  audio_source: "couper"
  volume_musique: 0.85

mode_plan: "scenario"
scenario:
  duree_par_defaut: 10
  sequences:
    - { taille: 16, effet: "lsd_audio", duree: 15 }
    - { taille: 32, effet: "lsd_audio", duree: 15 }
